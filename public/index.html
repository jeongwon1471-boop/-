<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>식권 관리</title><style>body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#243044;margin:0}.wrap{max-width:850px;margin:auto;padding:18px}header,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}.card{background:white;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #0001}button,input,select{font:inherit;padding:11px;border:1px solid #cad1dc;border-radius:9px}button{cursor:pointer}button.primary{background:#2458d4;color:white;border:0}button.plus{background:#15805d;color:white;font-size:24px;min-width:48px}button.minus{font-size:24px;min-width:48px}.hidden{display:none}.muted{color:#64748b}.item{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.item .name{flex:1;min-width:0;overflow-wrap:anywhere}.number{min-width:35px;text-align:center;font-weight:700}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}#notice{color:#b42318;min-height:22px}input[type=search]{width:100%;box-sizing:border-box}h1{font-size:24px}</style></head><body><div class="wrap"><header><h1>🍱 복지정책팀 밀밀meal-meal 대장🌸</h1><div><button onclick="show('staff')">직원용</button> <button onclick="show('admin')">관리자용</button></div></header><p id="notice" role="alert"></p><section id="staff"><div class="card"><h2>식권 사용 입력</h2><label>내 이름 <select id="person"></select></label><p class="muted">식당을 검색해 + 버튼을 누르세요. 날짜는 오늘로 자동 기록됩니다.</p><input id="search" type="search" placeholder="🔎 식당 이름 검색"><p id="staffTotal"></p><div id="restaurantList"></div></div></section><section id="admin" class="hidden"><div id="loginBox" class="card"><h2>관리자 로그인</h2><input id="password" type="password" placeholder="관리자 비밀번호"> <button class="primary" onclick="login()">로그인</button></div><div id="panel" class="hidden"><div class="card"><div class="row"><h2>직원 관리</h2><button onclick="logout()">로그아웃</button></div><input id="newPerson" placeholder="직원 이름"> <button class="primary" onclick="add('people','newPerson')">추가</button><div id="peopleList"></div></div><div class="card"><h2>식당 관리 (30곳 이상 가능)</h2><input id="newRestaurant" placeholder="식당 이름"> <button class="primary" onclick="add('restaurants','newRestaurant')">추가</button><div id="adminRestaurants"></div></div><div class="card"><h2>월별 집계</h2><label>조회 월 <input id="month" type="month"></label> <button onclick="report()">조회</button> <button class="primary" onclick="csv()">엑셀 CSV 다운로드</button><p id="grandTotal"></p><h3>직원별</h3><div class="scroll"><table><thead><tr><th>직원</th><th>합계</th></tr></thead><tbody id="byPerson"></tbody></table></div><h3>식당별</h3><div class="scroll"><table><thead><tr><th>식당</th><th>합계</th></tr></thead><tbody id="byRestaurant"></tbody></table></div><h3>상세 내역</h3><div class="scroll"><table><thead><tr><th>직원</th><th>식당</th><th>날짜</th><th>장수</th></tr></thead><tbody id="details"></tbody></table></div></div></div></section></div><script>
const $=id=>document.getElementById(id),monthNow=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,7)};let token=sessionStorage.getItem('meal_admin')||'',restaurants=[],usage=[],rows=[],busy=false;
$('month').value=monthNow();function notice(s){$('notice').textContent=s||''}async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d}
function show(w){$('staff').classList.toggle('hidden',w!=='staff');$('admin').classList.toggle('hidden',w!=='admin');if(w==='admin'&&token)loadAdmin()}
async function loadStaff(){try{const [p,r]=await Promise.all([api('/api/people'),api('/api/restaurants')]);restaurants=r;const old=$('person').value;$('person').replaceChildren();for(const x of p){const o=new Option(x.name,x.id);$('person').add(o)}if(p.some(x=>String(x.id)===old))$('person').value=old;await loadUsage()}catch(e){notice(e.message)}}
async function loadUsage(){if(!$('person').value){usage=[];renderRestaurants();return}try{usage=await api('/api/usage?person='+$('person').value+'&month='+monthNow());renderRestaurants()}catch(e){notice(e.message)}}
function renderRestaurants(){const q=$('search').value.trim().toLowerCase();$('restaurantList').replaceChildren();$('staffTotal').textContent='이번 달 총 '+usage.reduce((s,x)=>s+x.count,0)+'장';for(const r of restaurants.filter(x=>x.name.toLowerCase().includes(q))){const row=document.createElement('div');row.className='item';const name=document.createElement('span');name.className='name';name.textContent=r.name;const n=document.createElement('span');n.className='number';n.textContent=(usage.find(x=>x.restaurant_id===r.id)?.count||0)+'장';const minus=document.createElement('button');minus.className='minus';minus.textContent='−';minus.onclick=()=>click(r.id,-1);const plus=document.createElement('button');plus.className='plus';plus.textContent='+';plus.onclick=()=>click(r.id,1);row.append(name,minus,n,plus);$('restaurantList').append(row)}if(!restaurants.length)$('restaurantList').textContent='관리자가 식당을 등록해 주세요.'}
async function click(id,delta){if(busy)return;busy=true;try{await api('/api/click',{method:'POST',body:JSON.stringify({person:Number($('person').value),restaurant:id,delta})});await loadUsage()}catch(e){notice(e.message)}finally{busy=false}}
$('person').onchange=loadUsage;$('search').oninput=renderRestaurants;
async function login(){try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});token=d.token;sessionStorage.setItem('meal_admin',token);$('password').value='';await loadAdmin()}catch(e){notice(e.message)}}
async function logout(){try{await api('/api/admin/logout',{method:'POST'})}catch{}token='';sessionStorage.removeItem('meal_admin');$('panel').classList.add('hidden');$('loginBox').classList.remove('hidden')}
async function loadAdmin(){try{$('panel').classList.remove('hidden');$('loginBox').classList.add('hidden');await Promise.all([list('people','peopleList'),list('restaurants','adminRestaurants'),report()])}catch(e){notice(e.message)}}
async function list(route,target){const data=await api('/api/admin/'+route);$(target).replaceChildren();for(const x of data){const row=document.createElement('div');row.className='item';const label=document.createElement('span');label.className='name';label.textContent=x.name+(x.active?'':' (사용 중지)');const b=document.createElement('button');b.textContent=x.active?'사용 중지':'다시 사용';b.onclick=async()=>{try{await api('/api/admin/'+route+'/'+x.id,{method:'PATCH',body:JSON.stringify({active:!x.active})});await list(route,target);await loadStaff()}catch(e){notice(e.message)}};row.append(label,b);$(target).append(row)}}
async function add(route,field){try{await api('/api/admin/'+route,{method:'POST',body:JSON.stringify({name:$(field).value})});$(field).value='';await list(route,route==='people'?'peopleList':'adminRestaurants');await loadStaff()}catch(e){notice(e.message)}}
function fill(id,data){$(id).replaceChildren();for(const values of data){const tr=document.createElement('tr');for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td)}$(id).append(tr)}}
async function report(){try{rows=await api('/api/admin/report?month='+$('month').value);const people=new Map(),rest=new Map();for(const r of rows){people.set(r.person,(people.get(r.person)||0)+r.count);rest.set(r.restaurant,(rest.get(r.restaurant)||0)+r.count)}fill('byPerson',[...people].map(([a,b])=>[a,b]));fill('byRestaurant',[...rest].map(([a,b])=>[a,b]));fill('details',rows.map(r=>[r.person,r.restaurant,r.day,r.count]));$('grandTotal').textContent='총 '+rows.reduce((s,r)=>s+r.count,0)+'장'}catch(e){notice(e.message)}}
function cell(v){const s=String(v??'');return '"'+(/^[=+@\-\t\r]/.test(s)?"'"+s:s).replace(/"/g,'""')+'"'}function csv(){const lines=[['직원','식당','날짜','장수'],...rows.map(r=>[r.person,r.restaurant,r.day,r.count])];const data='\ufeff'+lines.map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='식권집계_'+$('month').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
loadStaff();if(token)loadAdmin();
</script></body></html>
